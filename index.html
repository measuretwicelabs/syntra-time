<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1317">
<title>SyntraTime</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!--
  SyntraTime, the phone page (owner, 17 Nov 2026; built from the screens agreed as mockups on 19 Nov 2026: Linework docs/QUOTES_PLAN.md, section 6b, and docs/time_mockups/).
  Added to the phone's home screen from Chrome; after one sign-in it keeps every tap on the phone first and saves it into Syntra\Time\ in the shop's OneDrive.
  The sums and the rules are all in syntratime.js; store.js keeps and sends; view.js puts what syntratime.js gives back in the order a screen wants; ms.js is the sign-in;
  help.js is the Help window's words; app.js is the screens. This file is the frame and the look.

  It holds no data of the owner and no secret. CLIENT_ID below is the public number of the registration with Microsoft; it is meant to be seen, and by itself it opens nothing.
  Where the Syntra folder is in OneDrive is given once in the link that sets the page up, after the # (so it is never sent to any server), and kept on the phone.
-->
<style>
:root{--bg:#0e1317;--card:#141b21;--field:#0a0f13;--fg:#d8e1e8;--muted:#8594a1;--rule:#25303a;--mark:#f0b24a;--good:#5fd08a;--bad:#ff7a6b;--btn:#4ea2ff;--btn-ink:#06121e;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:17px/1.3 'IBM Plex Sans Condensed','Roboto Condensed','Arial Narrow',sans-serif-condensed,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:max(16px,env(safe-area-inset-top)) 16px 10px}
.top .mark{flex:none}
.top .name{display:flex;flex-direction:column;flex:1;min-width:0}
.top .title{font-size:21px;font-weight:600;letter-spacing:.02em}
.sub{font-size:13.5px;color:var(--muted)}
#body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:8px;padding:4px 16px 10px}
.label{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:9px}
.row>.grow,.grow{flex:1;min-width:0}
.dot{width:11px;height:11px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)}.dot.wait{background:var(--mark)}.dot.bad{background:var(--bad)}
.mono{font-family:var(--mono)}
.small{font-size:13.5px;color:var(--muted)}
.amber{color:var(--mark)}
button{font:inherit;color:var(--fg);cursor:pointer}
.btn{font-size:15px;min-height:48px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);padding:0 12px}
.btn.go{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600;font-size:18px;min-height:60px}
.btn.stop{font-weight:600;min-width:68px;border-color:var(--fg);background:var(--fg);color:var(--bg)}
.btn.warn{border-color:var(--mark);color:var(--mark)}
.btn:disabled{opacity:.5}
.status{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 4px;border:0;background:none;font-size:13.5px;color:var(--muted)}
.status.wait{color:var(--mark)}
.back{display:flex;align-items:center;justify-content:center;gap:4px;min-width:76px;min-height:48px;border-radius:10px;border:1px solid var(--rule);background:var(--card)}
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--rule);background:var(--card)}
.bar.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.bar .wide{grid-column:1/-1}.bar .note{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:center}
.log{display:grid;grid-template-columns:78px minmax(0,1fr);column-gap:10px;row-gap:7px;font-size:14.5px}
.log .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.log .line{font:inherit;text-align:left;background:none;border:0;padding:0;color:inherit}
.log .line.odd{color:var(--mark)}
.log .detail{display:block;margin-top:3px;font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.daynote{grid-column:1/-1;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .panel{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--card);border:1px solid var(--rule);border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:19px;font-weight:600}
.sheet p{margin:0}
.sheet details{border-top:1px solid var(--rule);padding:4px 0}
.sheet summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.sheet details p{margin:0 0 8px;font-size:15.5px;color:var(--fg)}
.sheet .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.section{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:9px 9px 9px 14px}
.trow .op{font-size:17px;font-weight:600}.trow .grow{display:flex;flex-direction:column;gap:1px}
.trow .time,.tcard .time{font-family:var(--mono);font-size:15px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px}
.input{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--rule);border-radius:10px;min-height:48px;padding:0 14px;width:100%}
textarea.input{padding:10px 14px;min-height:76px;resize:none}
.pick{font:inherit;text-align:left;display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--fg)}
.pick.amber-edge{border-color:var(--mark)}
.pick .more{font-size:13.5px;color:var(--muted)}
.opgrid,.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.opbtn{font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:52px;padding:5px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--fg)}
.opbtn.running{border-color:var(--good)}.opbtn .on{font-size:13px;color:var(--good)}
.opbtn.dim{border-style:dashed;background:var(--bg);color:var(--muted)}
.opbtn.dim .where,.opbtn .where{font-size:12.5px}.opbtn .where.amber{color:var(--mark)}
.opbtn.chosen{border-color:var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:600;flex-direction:row;align-items:center;gap:8px}
.tcard{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--good);border-radius:12px;padding:10px}
.tcard .who{font-size:17px;font-weight:600}.tcard .note{font-size:13.5px;color:var(--muted);min-height:34px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--mark)}
.note-error{border:1px solid var(--mark);border-radius:10px;padding:10px 12px;color:var(--mark);display:flex;flex-direction:column;gap:8px}
.step{font-size:13.5px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:8px}.prow .who{font-weight:600}.small.good{color:var(--good)}
.alert{border:1px solid var(--mark);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#1a1710}.askrow{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px}.askrow .row{gap:8px}.askrow .row .btn{flex:1}
.check.big{min-height:52px;padding:0 14px;background:var(--card);border:1px solid var(--btn);border-radius:10px;margin-bottom:6px;display:flex;align-items:center;gap:12px}.bigrow{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}.kmrow{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;padding-top:4px}.kmgo{color:var(--fg);font-family:var(--mono)}.small.amber{color:var(--mark)}
.rowlink{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;min-height:44px;display:block}.rowlink .op,.rowlink .sub{display:block}.facts{display:flex;flex-direction:column;gap:8px}.fact{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:6px 6px 6px 14px}.fact .fl{width:86px;color:var(--muted);font-size:13.5px}.fact .fv{min-width:0;display:flex;flex-direction:column}.fact .how{font-size:13px;color:var(--muted)}.fact .clk{font-family:var(--mono)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"><header class="top" id="top"></header><main id="body"></main><footer class="bar" id="bar" hidden></footer></div>
<div class="sheet" id="sheet" hidden></div>
<script>
/* the public number of the registration with Microsoft ("Application (client) ID"; the registration is named SyntraTime, for personal accounts only, owner, 18 Nov 2026).
   Not a secret: it is meant to be seen and opens nothing by itself. */
const CLIENT_ID = '436cbe32-930e-478d-84cf-97aecef7dd0d';
</script>
<script src="syntratime.js"></script>
<script src="store.js"></script>
<script src="view.js"></script>
<script src="help.js"></script>
<script src="ms.js"></script>
<script src="app.js"></script>
</body>
</html>
